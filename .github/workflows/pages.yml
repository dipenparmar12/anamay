name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Values that differ per deployment. Set the optional ones under Settings > Secrets and variables > Actions > Variables
      # (API_BASE_URL, DONATION_MODE, GA4_ID); see docs/configuration.md. Nothing secret is needed to build the site.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DONATION_MODE: ${{ vars.DONATION_MODE }}
          GA4_ID: ${{ vars.GA4_ID }}
          LEGACY_REDIRECTS: true
      - run: rm -rf node_modules src
        working-directory: website
      - run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
